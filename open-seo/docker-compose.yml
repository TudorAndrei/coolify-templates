services:
  # Auth gate in front of the app. The upstream Docker build runs with app
  # auth disabled (AUTH_MODE=local_noauth) and the docs say to expose it
  # only behind an auth-protected proxy. Coolify cannot attach a Traefik
  # basicauth middleware from this file without hand-editing generated
  # router labels, so a small Caddy does the basic auth instead.
  proxy:
    image: 'caddy:2-alpine'
    container_name: open-seo-proxy
    environment:
      # Coolify routes the domain here, not to the app container.
      - SERVICE_FQDN_PROXY_8080
      # Coolify generates the credentials; read them in the Environment
      # Variables tab of the service.
      - 'BASIC_AUTH_USER=${SERVICE_USER_OPENSEO}'
      - 'BASIC_AUTH_PASSWORD=${SERVICE_PASSWORD_OPENSEO}'
    # Caddy wants a bcrypt hash and Coolify only generates plaintext, so
    # the hash is computed at container start. `$$` keeps docker compose
    # from interpolating what the shell must see.
    command:
      - sh
      - -c
      - |
        printf ':8080 {\nbasic_auth {\n%s %s\n}\nreverse_proxy open-seo:3001\n}\n' \
          "$$BASIC_AUTH_USER" \
          "$$(caddy hash-password --plaintext "$$BASIC_AUTH_PASSWORD")" \
          > /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    expose:
      - '8080'
    depends_on:
      - open-seo
    healthcheck:
      # TCP only: an HTTP probe would get a 401 from basic auth.
      test:
        - CMD-SHELL
        - 'nc -z 127.0.0.1 8080 || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  open-seo:
    image: 'ghcr.io/every-app/open-seo:latest'
    container_name: open-seo
    environment:
      # Passes process env into the Cloudflare Vite runtime as Worker
      # bindings; without it the container ignores every variable below.
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=3001
      # Vite preview rejects requests for other hostnames. Caddy forwards
      # the original Host header, so this must be the public domain.
      - 'ALLOWED_HOST=${SERVICE_FQDN_PROXY}'
      # Single local admin user, no app-level auth — the proxy above is
      # the lock. AUTH_MODE=hosted exists but leaves sign-up open to
      # anyone, and every user spends DataForSEO credits.
      - AUTH_MODE=local_noauth
      # Required: base64("login:password") from app.dataforseo.com.
      # Set it in the Environment Variables tab; usage is billed by
      # DataForSEO directly.
      - 'DATAFORSEO_API_KEY=${DATAFORSEO_API_KEY}'
      # Optional: enables the SAM AI features.
      - 'OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}'
      - 'OPENROUTER_MODEL=${OPENROUTER_MODEL:-}'
      - OPENSEO_TELEMETRY_DISABLED=1
      - DO_NOT_TRACK=1
      - VITE_SHOW_DEVTOOLS=false
    expose:
      - '3001'
    volumes:
      # All state (the local D1/SQLite database, KV, tokens) lives in the
      # wrangler directory.
      - 'open-seo-data:/app/.wrangler'
    healthcheck:
      # node is the only runtime guaranteed in the image; curl/wget/bash
      # are not. /api/health reports configuration and database status.
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  open-seo-data:
