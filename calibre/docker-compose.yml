services:
  calibre-web-automated:
    image: 'crocodilestick/calibre-web-automated:latest'
    container_name: calibre-web-automated
    environment:
      - PUID=1000
      - PGID=100
      - TZ=UTC
      - 'HARDCOVER_TOKEN=${HARDCOVER_TOKEN}'
    volumes:
      - 'cwa-config:/config'
      - 'cwa-book-ingest:/cwa-book-ingest'
      - '/home/tudor/calibre_config:/calibre-library'
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://localhost:8083/ || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  downloader:
    image: 'ghcr.io/calibrain/shelfmark:latest'
    environment:
      - SERVICE_FQDN_DOWNLOADER_8084
      - PUID=1000
      - PGID=100
      - TZ=UTC
      - FLASK_PORT=8084
      - FLASK_DEBUG=false
      - BOOK_LANGUAGE=en
      - INGEST_DIR=/cwa-book-ingest
      - AUTH_METHOD=cwa
      - CWA_DB_PATH=/auth/app.db
      - 'CALIBRE_WEB_URL=https://calibre.tudorandrei.xyz'
      - USE_CF_BYPASS=true
      - SESSION_COOKIE_SECURE=true
      - HARDCOVER_ENABLED=true
      - 'HARDCOVER_API_KEY=${HARDCOVER_TOKEN}'
    expose:
      - '8084'
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost:8084/api/health'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    volumes:
      - 'shelfmark-config:/config'
      - 'cwa-config:/auth:ro'
      - 'cwa-book-ingest:/cwa-book-ingest'

volumes:
  cwa-config:
  cwa-book-ingest:
  shelfmark-config:
